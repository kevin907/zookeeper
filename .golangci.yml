version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - prealloc
    - bodyclose
    - nilerr
    - errorlint
    - exhaustive
    - forbidigo

  settings:
    gocyclo:
      min-complexity: 10
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    forbidigo:
      forbid:
        - pattern: '^fmt\.Println$'
          msg: "use slog for structured logging; fmt.Println is banned outside main and tests"
        - pattern: '^log\.Println$'
          msg: "use slog for structured logging; log.Println is banned outside main and tests"
    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    rules:
      - path: cmd/api/
        linters:
          - forbidigo
      - path: _test\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kevintrivedi/zoo-api

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
