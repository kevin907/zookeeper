services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zoo}
      POSTGRES_DB: ${POSTGRES_DB:-zoo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER:-zoo}:${POSTGRES_PASSWORD:-zoo}@postgres:5432/${POSTGRES_DB:-zoo}?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SOLVER: ${SOLVER:-greedy}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data: {}
